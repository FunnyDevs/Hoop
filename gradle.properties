org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Map configuration (not secret). The style is a free OpenFreeMap light style.
hoop.map.styleUri=https://tiles.openfreemap.org/styles/positron
# Fallback map center (Milan) used when the user has not shared a location.
hoop.map.fallbackLatitude=45.4642
hoop.map.fallbackLongitude=9.19

